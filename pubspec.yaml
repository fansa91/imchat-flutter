name: imchat
description: "IMChat - iMessage 风格的即时通讯客户端（Flutter 多平台）"
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  dynamic_color: ^1.9.0  # 2.x 依赖独立的 material_ui 包，与 flutter/material 的 ColorScheme 类型不兼容
  record: ^7.1.2
  audioplayers: ^6.8.1
  uuid: ^4.6.0
  image_picker: ^1.2.4
  file_selector: ^1.1.0
  image: ^4.12.0
  gal: ^2.3.3
  flutter_webrtc: ^1.6.2+hotfix.4
  video_player: ^2.14.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
