name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
            echo "Release keystore configured."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APKs will be debug-signed."
          fi
      - run: flutter build apk --release --split-per-abi
      - name: Rename split APKs
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/imchat-${VERSION}-android-${abi}.apk"
          done
      - run: flutter build apk --release
      - name: Rename universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "dist/imchat-${VERSION}-android-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr "imchat-${VERSION}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: imchat-*-ios-unsigned.ipa

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package DMG
        run: |
          hdiutil create -volname IMChat \
            -srcfolder build/macos/Build/Products/Release/IMChat.app \
            -ov -format UDZO "imchat-${VERSION}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: imchat-*-macos.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi
      - name: Install dependencies
        run: |
          sudo apt-get update
          # ubuntu-22.04 镜像预装的 libunwind-14-dev 与 gstreamer 依赖的 libunwind-dev 冲突
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfuse2 file
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/imchat" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          cat > AppDir/imchat.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=IMChat
          Exec=imchat
          Icon=imchat
          Categories=Network;Chat;
          DESKTOP
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/imchat.png
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "imchat-${VERSION}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: imchat-*-linux-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: |
          if (-not $env:GITHUB_REF.StartsWith('refs/tags/')) {
            "VERSION=dev-$($env:GITHUB_SHA.Substring(0,7))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package ZIP
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "imchat-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: imchat-*-windows-x64.zip

  release:
    needs: [android, ios, macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
